<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase Test</title>
  <style>
    body { 
      font-family: system-ui; 
      max-width: 600px; 
      margin: 50px auto; 
      padding: 20px;
      background: #0f1115;
      color: #fff;
    }
    input, button { 
      width: 100%; 
      padding: 12px; 
      margin: 8px 0; 
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d27;
      color: #fff;
      font-size: 14px;
    }
    button { 
      background: #4f8cff; 
      cursor: pointer;
      font-weight: 600;
    }
    #status { 
      margin-top: 20px; 
      padding: 12px;
      border-radius: 8px;
      background: #1a1d27;
    }
    .success { color: #2ecc71; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <h1>🧪 Supabase Connection Test</h1>
  
  <input type="text" id="url" placeholder="Supabase URL" 
         value="https://jdsojjjrxsknffuogdux.supabase.co" />
  
  <input type="text" id="key" placeholder="Supabase Key" 
         value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkc29qampyeHNrbmZmdW9nZHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjEwNjMsImV4cCI6MjA4NjgzNzA2M30.zPPzQev60bopgiBlenNAezIsYfNg8m5IMAigfsDGIhs" />
  
  <button onclick="testConnection()">Test Connection</button>
  <button onclick="saveTestData()">Save Test Data</button>
  <button onclick="loadTestData()">Load Test Data</button>
  
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabase;
    const status = document.getElementById('status');
    
    function log(msg, isError = false) {
      status.innerHTML += `<div class="${isError ? 'error' : 'success'}">${msg}</div>`;
      console.log(msg);
    }
    
    async function testConnection() {
      status.innerHTML = '';
      const url = document.getElementById('url').value.trim();
      const key = document.getElementById('key').value.trim();
      
      if (!url || !key) {
        log('❌ Bitte URL und Key eingeben', true);
        return;
      }
      
      try {
        log('🔄 Erstelle Supabase Client...');
        supabase = supabase_js.createClient(url, key);
        log('✅ Client erstellt!');
        
        log('🔄 Teste Verbindung zur Datenbank...');
        const { data, error } = await supabase
          .from('daily_entries')
          .select('datum')
          .limit(1);
        
        if (error) {
          log('❌ Datenbankfehler: ' + error.message, true);
          log('Details: ' + JSON.stringify(error), true);
        } else {
          log('✅ Verbindung erfolgreich!');
          log('📊 Gefundene Einträge: ' + (data ? data.length : 0));
        }
      } catch (err) {
        log('❌ Fehler: ' + err.message, true);
        console.error(err);
      }
    }
    
    async function saveTestData() {
      if (!supabase) {
        log('❌ Bitte erst Verbindung testen', true);
        return;
      }
      
      status.innerHTML = '';
      const today = new Date().toISOString().slice(0, 10);
      
      try {
        log('🔄 Speichere Test-Daten für ' + today + '...');
        const { data, error } = await supabase
          .from('daily_entries')
          .upsert({
            datum: today,
            training: true,
            meditation_min: 10,
            cold_shower: true
          }, { onConflict: 'datum' })
          .select();
        
        if (error) {
          log('❌ Speicherfehler: ' + error.message, true);
        } else {
          log('✅ Daten gespeichert!');
          log('📄 ' + JSON.stringify(data, null, 2));
        }
      } catch (err) {
        log('❌ Fehler: ' + err.message, true);
        console.error(err);
      }
    }
    
    async function loadTestData() {
      if (!supabase) {
        log('❌ Bitte erst Verbindung testen', true);
        return;
      }
      
      status.innerHTML = '';
      
      try {
        log('🔄 Lade alle Einträge...');
        const { data, error } = await supabase
          .from('daily_entries')
          .select('*')
          .order('datum', { ascending: false });
        
        if (error) {
          log('❌ Ladefehler: ' + error.message, true);
        } else {
          log('✅ Daten geladen!');
          log('📊 Anzahl Einträge: ' + (data ? data.length : 0));
          if (data && data.length > 0) {
            log('📄 ' + JSON.stringify(data, null, 2));
          }
        }
      } catch (err) {
        log('❌ Fehler: ' + err.message, true);
        console.error(err);
      }
    }
  </script>
</body>
</html>
