      - "Alle alten Felder aus App.tsx sind im neuen Typ enthalten"
    acceptance_criteria:
      - "DashboardEntry enthält: weightKg, waterLiters, deepWorkHours, journalText"
      - "dailyScore field vorhanden als number 0-100"
      - "TypeScript strict-mode kompatibel ohne any-casts"
    tech_stack:
      - "TypeScript 5.9"
    test_coverage: null
    requires_review: false
    review_depth: null
    review_security_sensitive: false
    failure_modes:
      - scenario: "Typ-Inkompatibilitäten beim Import in Komponenten"
        likelihood: low
        impact: medium
        mitigation: "Alle Felder mit sinnvollen Defaults definieren, optional-chaining wo nötig"

  - id: T2
    title: "Supabase Schema Design + RLS Strategy"
    description: |
      Entwirf das Supabase PostgreSQL Schema für die daily_entries Tabelle.
      Alle DashboardEntry-Felder als Spalten (boolean, numeric, text).
      user_id TEXT column (UUID aus localStorage, kein Auth-Login nötig).
      RLS Policy: user_id = current_setting('app.user_id') oder via Supabase
      service_role bypass. Erstelle migration SQL Datei.
      Dokumentiere ENV-Vars: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY.
      Kein Hardcoding der Keys - alles über Vite env-Prefix VITE_.
    wave: 1
    agent: gem-researcher
    priority: high
    status: pending
    dependencies: []
    conflicts_with: []
    context_files:
      - path: "projectdashboardv1/package.json"
        description: "Prüfen ob @supabase/supabase-js bereits vorhanden"
    estimated_effort: small
    estimated_files: 2
    estimated_lines: 80
    focus_area: "Database & Security Architecture"
    verification:
      - "SQL Migration File erstellt in projectdashboardv1/supabase/migrations/"
      - "RLS Policy für user_id-Isolierung definiert"
      - "ENV-Var Naming Convention dokumentiert"
    acceptance_criteria:
      - "Keine Supabase Keys im Source Code"
      - "RLS verhindert Cross-User-Datenzugriff"
      - "Schema deckt alle DashboardEntry-Felder ab"
    tech_stack:
      - "PostgreSQL 15 (Supabase)"
      - "Supabase RLS"
    test_coverage: null
    requires_review: true
    review_depth: lightweight
    review_security_sensitive: true
    failure_modes:
      - scenario: "RLS zu restrictiv - blockiert anon-key Inserts"
        likelihood: medium
        impact: high
        mitigation: "Anon-key Insert Policy explizit erlauben, nur SELECT nach user_id einschränken"

  # ─── WAVE 2 ─────────────────────────────────────────────────────────────────
  - id: T3
    title: "DashboardEntry Typen + Daily Score Algorithmus implementieren"
    description: |
      Basierend auf T1 Research: Erstelle finales src/types/DashboardEntry.ts.
      Implementiere src/lib/score.ts mit calculateScore(entry) Funktion:
      - Boolean Habits: je 3-5 Punkte (konfigurierbar)
      - Schlaf 7+h: 10 Punkte, <6h: 0 Punkte
      - Meditation 10+min: 8 Punkte
      - Protein >=150g: 6 Punkte
      - Deep Work >=4h: 10 Punkte
      - Wasser >=2.5L: 6 Punkte
      - Kalorien in Range: 5 Punkte
      - Gewicht getrackt: 3 Punkte
      - Journal geschrieben (len>50): 5 Punkte
      Gesamtmax 100, Score auf 100 normalisiert.
      Implementiere auch src/lib/storage.ts (localStorage-Wrapper mit Migration).
    wave: 2
    agent: gem-implementer
    priority: high
    status: pending
    dependencies:
      - T1
    conflicts_with: []
    context_files:
      - path: "projectdashboardv1/src/App.tsx"
