plan_id: proj-life-maxsystem-2026
objective: >
  Rebuild 'Project Life' als maximales System. Komplett neue saubere Single-App
  basierend auf projectdashboardv1 (React/Vite/TypeScript). Features: Supabase
  Cloud-Sync via ENV-Vars, Chart.js Charts (7-Tage-Trends, Monatsübersicht),
  Daily Score System 0-100, erweiterte Tracking-Felder (Gewicht, Wasser, Deep Work,
  Journal-Text), bessere UX (mobile-first, dark theme), PWA-Setup.
  Alle alten Versionen (project-life-dashboard__de, __v1, __v1-supabase, api/)
  werden nach erfolgreichem Build gelöscht. vercel.json zeigt auf projectdashboardv1.
created_at: "2026-03-29"
created_by: gem-planner
status: pending_approval
research_confidence: high

plan_metrics:
  wave_1_task_count: 2
  total_dependencies: 18
  risk_score: medium

tldr: |
  6-Wellen-DAG mit 12 Tasks. Wellen 1-2 legen Foundation (Typen, Supabase-Schema).
  Wellen 3-4 bauen parallel alle Features (Charts, Formular, Sync, PWA).
  Welle 5 integriert und deployed. Welle 6 reviewt Security und testet E2E.
  Kernrisiko: Supabase RLS-Konfiguration + Chart.js Render-Performance.
  Alle alten Verzeichnisse werden erst nach grünem E2E-Test gelöscht.

open_questions:
  - "Soll der Daily Score rein clientseitig berechnet oder in Supabase als computed column gespeichert werden? (Annahme: clientseitig)"
  - "PWA: Offline-Fallback auf localStorage wenn Supabase nicht erreichbar? (Annahme: ja)"
  - "Soll ein User-Auth-Flow (Supabase Auth) existieren oder reicht anon_key mit Row-Level Security per user_id aus ENV?"

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "Supabase CORS oder RLS blockiert Zugriff aus Vercel-Domain"
      likelihood: medium
      impact: high
      mitigation: "RLS-Policy und allowed_origins in Supabase frühzeitig konfigurieren (T4). Integrations-Test vor Cleanup alter Dirs."
    - scenario: "Chart.js Bundle-Größe sprengt 250KB Budget → schlechte Performance"
      likelihood: low
      impact: medium
      mitigation: "Tree-shaking, nur benötigte Chart-Typen registrieren (T5). Vite build analyze step einbauen."
    - scenario: "ENV-Vars nicht in Vercel konfiguriert → App bricht in Produktion"
      likelihood: medium
      impact: high
      mitigation: "Graceful degradation auf localStorage wenn VITE_SUPABASE_URL fehlt (T7). Vercel ENV-Vars in Deployment-Task dokumentieren (T11)."
    - scenario: "Daten-Migration: bestehende localStorage-Einträge passen nicht zum neuen Schema"
      likelihood: medium
      impact: medium
      mitigation: "Migration-Funktion in loadEntries() die alte Felder mappt und neue mit Defaults füllt (T3)."
  assumptions:
    - "projectdashboardv1 ist die einzige Quelle der Wahrheit — kein Code aus alten Versionen wird übernommen"
    - "Supabase-Projekt existiert bereits oder wird in T4 neu erstellt"
    - "vite-plugin-pwa v0.20+ kompatibel mit Vite 7"
    - "Daily Score Gewichtung: jedes erfüllte boolean Habit = 1 Punkt, numerische Felder haben Schwellwerte"
    - "Keine Supabase Auth nötig — user_id wird aus ENV oder generierter UUID aus localStorage gezogen"

implementation_specification:
  code_structure: |
    projectdashboardv1/src/
      types/          → DashboardEntry.ts, ScoreConfig.ts
      lib/            → supabase.ts (client), score.ts (algorithm), storage.ts (localStorage fallback)
      hooks/          → useEntries.ts (unified Supabase+localStorage), useDailyScore.ts
      components/
        forms/        → MorningForm.tsx, EveningForm.tsx, ExtendedFields.tsx
        charts/       → WeeklyChart.tsx, MonthlyChart.tsx, ScoreGauge.tsx
        ui/           → HabitToggle.tsx, MetricInput.tsx, ScoreBadge.tsx, SyncStatus.tsx
      views/          → DashboardView.tsx, HistoryView.tsx, StatsView.tsx
      App.tsx         → Router-Shell + Provider
      main.tsx        → PWA registration + App mount
  affected_areas:
    - "projectdashboardv1/src/ — vollständige Neustrukturierung"
    - "projectdashboardv1/public/ — manifest.json, icons"
    - "projectdashboardv1/vite.config.ts — PWA plugin + env"
    - "projectdashboardv1/package.json — neue deps: @supabase/supabase-js, vite-plugin-pwa"
    - "vercel.json — Root-Ebene zeigt auf projectdashboardv1"
    - "Zu löschende Dirs: project-life-dashboard__de, __v1, __v1-supabase, api/"
  component_details:
    - component: "DashboardEntry (Type)"
      responsibility: "Erweiterte Datenstruktur mit allen Tracking-Feldern"
      interfaces:
        - "weightKg: number, waterLiters: number, deepWorkHours: number, journalText: string"
        - "dailyScore: number (0-100, computed), scoreBreakdown: ScoreBreakdown"
    - component: "useEntries Hook"
      responsibility: "Unified CRUD für Supabase primary + localStorage fallback, Offline-Detection"
      interfaces:
        - "entries: DashboardEntry[], loading: boolean, saveEntry(e), loadEntry(date)"
        - "syncStatus: 'online'|'offline'|'syncing'|'error'"
    - component: "DailyScore Engine"
      responsibility: "Berechnet Score 0-100 aus Entry-Werten mit konfigurierbaren Gewichtungen"
      interfaces:
        - "calculateScore(entry: DashboardEntry): number"
        - "getScoreBreakdown(entry): {category: string, points: number, max: number}[]"
    - component: "WeeklyChart / MonthlyChart"
      responsibility: "Chart.js Line/Bar Charts für Score-Trends, per-Habit-Completion-Rates"
      interfaces:
        - "WeeklyChart({entries: DashboardEntry[]})"
        - "MonthlyChart({entries: DashboardEntry[], month: string})"
    - component: "SupabaseClient lib"
      responsibility: "Singleton Supabase client aus VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY"
      interfaces:
        - "getClient(): SupabaseClient | null (null wenn ENV fehlt → localStorage-only mode)"
  dependencies:
    - component: "WeeklyChart"
      relationship: "konsumiert DashboardEntry[] aus useEntries Hook"
    - component: "useEntries"
      relationship: "ruft SupabaseClient auf; fällt back auf localStorage storage.ts"
    - component: "DashboardView"
      relationship: "komponiert MorningForm + EveningForm + ScoreGauge + WeeklyChart"
  integration_points:
    - "Supabase table 'daily_entries' mit RLS (user_id = current_user_id aus localStorage UUID)"
    - "Vite env: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY → .env.local + Vercel ENV"
    - "vite-plugin-pwa generiert Service Worker + manifest automatisch aus vite.config.ts"
    - "vercel.json: buildCommand='cd projectdashboardv1 && npm run build', outputDirectory='projectdashboardv1/dist'"

