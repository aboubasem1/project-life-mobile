        impact: high
        mitigation: "vite build --sourcemap=false in prod, anon_key ist per Definition öffentlich aber RLS schützt Daten"

  # ─── WAVE 3 ─────────────────────────────────────────────────────────────────
  - id: T5
    title: "Chart.js Integration — WeeklyChart, MonthlyChart, ScoreGauge"
    description: |
      Installiere chart.js + react-chartjs-2. Erstelle 3 Komponenten:
      1. WeeklyChart.tsx: Line Chart, letzte 7 Tage Daily Score + eine Habit-Linie
