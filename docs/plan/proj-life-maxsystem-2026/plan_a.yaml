      Definiere finale DashboardEntry-Typen mit neuen Feldern:
      weightKg, waterLiters, deepWorkHours, journalText, dailyScore.
      Erstelle src/types/DashboardEntry.ts als Single-Source-of-Truth.
      Definiere ScoreConfig-Interface für Daily Score Gewichtungen.
    wave: 1
    agent: gem-researcher
    priority: high
    status: pending
    dependencies: []
    conflicts_with: []
    context_files:
