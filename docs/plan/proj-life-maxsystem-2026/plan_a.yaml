  - id: T12
    title: "Security Review — Supabase Keys, RLS, XSS, SSRF"
    description: |
      Vollständiger Security Audit des gebauten Systems:
      1. ENV Exposure: grep dist/ auf SUPABASE Keys → kein Treffer erlaubt
      2. RLS Verification: Supabase RLS Policy prüfen - kann User A Daten von User B lesen?
      3. XSS check: Journal-Text Rendering - wird als text, nicht dangerouslySetInnerHTML gerendert?
      4. SSRF: Keine server-seitige URL-Konstruktion aus User-Input
      5. Supabase anon_key Scope: Nur minimal nötige Berechtigungen
      6. localStorage user_id: Kann User es für Privilege Escalation manipulieren?
         → user_id muss in RLS Server-seitig validiert werden
      Erstelle Security Report in docs/plan/proj-life-maxsystem-2026/security-review.md.
