      - "calculateScore(fullPerfectDay) === 100"
      - "storage.ts migriert alte Einträge ohne Datenverlust"
    acceptance_criteria:
      - "Score 0-100, nie negativ, nie über 100"
      - "getScoreBreakdown() gibt detaillierte Kategorie-Aufschlüsselung zurück"
      - "localStorage Migration: alte Einträge bekommen neue Felder mit Defaults"
    tech_stack:
