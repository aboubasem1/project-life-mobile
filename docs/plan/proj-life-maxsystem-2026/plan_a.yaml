        likelihood: medium
        impact: medium
        mitigation: "Alle numerischen Inputs mit || 0 defaulten vor Score-Berechnung"

  - id: T4
    title: "Supabase Client Setup + useEntries Hook"
    description: |
      Installiere @supabase/supabase-js. Erstelle src/lib/supabase.ts:
      - createClient aus VITE_SUPABASE_URL + VITE_SUPABASE_ANON_KEY
      - Wenn ENV fehlt → null zurückgeben (offline-mode)
      - user_id: UUID aus localStorage ('pl_user_id'), bei erstem Aufruf generieren
      Erstelle src/hooks/useEntries.ts:
      - loadEntry(date): Supabase query ODER localStorage fallback
      - saveEntry(entry): Supabase upsert ODER localStorage
      - loadAllEntries(): für Charts
      - syncStatus State Management
      - Optimistische Updates: erst localStorage schreiben, dann Supabase async
    wave: 2
    agent: gem-implementer
