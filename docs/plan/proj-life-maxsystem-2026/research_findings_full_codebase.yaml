# ─────────────────────────────────────────────
# DATA SCHEMA ANALYSE
# ─────────────────────────────────────────────
data_schema_comparison:
  note: >
    KRITISCHES PROBLEM: Alle 3 aktiven Versionen haben INKOMPATIBLE Datenschemata.
    Keine Datenmigration möglich ohne manuellen ETL-Prozess.

  schema_react_local:
    source: projectdashboardv1 + v1-supabase
    storage: localStorage (key: 'project-life-entries')
    format: Array<DashboardEntry>
    fields:
      - date (YYYY-MM-DD)
      - mood (string: emoji + text, e.g. "😊 MOTIVIERT")
      - sleepQuality (number 1-5, mapped to string options)
      - sleepDuration (free text string - z.B. "7h 30m")
      - meditationMinutes (number)
      - coldShower, proteinShake (boolean)
      - pushupsDone, squatsDone, wallsitDone, plankDone (boolean)
      - gratitudeDone, focusDone, winnerModeDone (boolean)
      - proteinGrams, calories, tasksDone (number)
      - journalDone, familyTimeDone (boolean)

  schema_mobile_supabase:
    source: project-life-dashboard__de/index.html
    storage: Supabase (daily_entries) + localStorage backup
    format: Object per date
    fields:
      - datum (DATE, PK)
      - am_training, pm_training (boolean)
      - am_sleep_hours, pm_sleep_hours (numeric)
      - am_sleep_quality_1_10, pm_sleep_quality_1_10 (integer 1-10)
      - am_mood_1_10, pm_mood_1_10 (integer 1-10)
      - am_weight_kg, pm_weight_kg (numeric)
      - am_focus_goal (text)
      - am_winner_mode, am_body_move, pm_winner_mode, pm_body_move (boolean)
      - pm_best_task, pm_gratitude, pm_notes (text)
      - score_zone_a (0-3), score_mindset (0-3), score_recovery (0-4)
      - streak_current, streak_best (integer)

  schema_streamlit_python:
    source: app-supabase.py
    storage: Supabase (daily_entries)
    format: Object per date
    fields:
      - datum (DATE)
      - training (boolean, single field - kein am/pm Split)
      - meditation_min, cold_shower, protein_shake (mixed)
      - deep_work_1_min, deep_work_2_min (number)
      - schritte (number - nicht in anderen Versionen!)
      - protein_gramm, bildschirmzeit_min, wasser_liter (number - nicht in anderen Versionen!)
      - journal, reading_min (mixed)

  missing_from_react_vs_mobile:
    - weight_kg (nur in mobile)
    - focus_goal_text (nur in mobile)
    - notes/journal_text (nur in mobile / Python)
    - deep_work_minutes (nur in Python)
    - water_liter (nur in Python)
    - steps (nur in Python)
    - screen_time_minutes (nur in Python)
    - score_zone_a/mindset/recovery (nur in mobile)
    - streak_best (nur in mobile)
    - reading_minutes (nur in Python)

