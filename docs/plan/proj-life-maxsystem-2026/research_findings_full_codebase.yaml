versions_overview:
  - name: project-life-dashboard__de
    path: project-life-dashboard__de/
    type: mixed
    components:
      - name: mobile (index.html)
        tech: Vanilla JS + Supabase SDK (CDN)
        status: feature-complete, deployed
        data: Supabase (daily_entries Tabelle)
      - name: web/
        tech: React 19 + Vite (TypeScript)
        status: UI-Mockup only – keine Funktionalität, hardcoded Dummy-Daten
        data: keine
      - name: app-supabase.py
        tech: Streamlit + Python + Supabase SDK
        status: funktionsfähig für Desktop
        data: Supabase (daily_entries Tabelle)
    notes: Enthält Duplikat von project-life-dashboard__v1

  - name: project-life-dashboard__v1
    path: project-life-dashboard__v1/
    type: copy
    notes: Identische Kopie von __de, kein eigenständiger Entwicklungsstand

  - name: project-life-dashboard__v1-supabase
    path: project-life-dashboard__v1-supabase/
    type: react_production
    components:
      - name: web/ (React App)
        tech: React 19 + Vite + TypeScript + @supabase/supabase-js@2
        status: Aktive Produktion (Vercel deployed)
        data: localStorage (primär) – Supabase nur in build.sh als ENV Var definiert, aber nicht im Code verwendet!
    vercel_config: root vercel.json zeigt auf dieses Verzeichnis
    critical_bug: >
      build.sh exportiert VITE_SUPABASE_URL und VITE_SUPABASE_ANON_KEY,
      aber App.tsx nutzt diese Variablen NICHT – Supabase ist faktisch dead code im Deployment

  - name: projectdashboardv1
    path: projectdashboardv1/
    type: react_latest
    tech: React 19 + Vite + TypeScript + Chart.js
    status: Aktuellste, feature-reichste Version (NICHT in prod deployed)
    data: localStorage only
    notes: Hat echtes Stats-View mit Streak-Tracking, fehlt aber Cloud-Sync

  - name: api/entries.js
    path: api/entries.js
    type: serverless
    tech: Vercel Serverless Function (Node.js)
    status: nicht mit einem Frontend verbunden
    critical_bug: >
      Nutzt in-memory Map (new Map()) – Daten gehen bei jedem Cold Start verloren.
      Kein persistentes Storage. Als "Backup" für localStorage beschrieben, faktisch non-functional.

