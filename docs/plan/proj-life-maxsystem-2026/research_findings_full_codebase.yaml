plan_id: proj-life-maxsystem-2026
objective: >
  Analysiere das 'Project Life' Dashboard-Projekt vollständig. Verstehe die aktuelle Architektur,
  alle Features, alle Versionen, Code-Qualität, UX-Probleme, fehlende Features, und identifiziere
  alle Optimization-Möglichkeiten für ein 'maximales System'.
focus_area: Full codebase analysis - architecture, features, code quality, UX, performance, data management
created_at: "2026-03-29"
created_by: gem-researcher
status: completed

tldr: |
  - VIER verschiedene Dashboard-Versionen existieren nebeneinander (vanilla JS, React/Vite ×2, Streamlit) mit INKOMPATIBLEN Datenschemata
  - Production-Deployment (`vercel.json` root) zeigt auf `project-life-dashboard__v1-supabase`, aber die aktuellste Version ist `projectdashboardv1` (nur localStorage)
  - KRITISCHES Sicherheitsproblem: Supabase Anon Key ist im Klartext in `build.sh` UND `index-clean.html` hardcoded
  - Die Kernanwendung (`projectdashboardv1`) ist feature-reich (Streak-Tracking, 7-Tage-Kalender, Stats-View) aber hat KEIN Cloud-Sync, KEINE Charts, KEINE Gewichts-/Wassererfassung
  - ~12 wichtige Features fehlen für ein "maximales System": Charts, Cloud-Sync, PWA, Wochenanalyse, Wassertracking, Gewicht, Deep Work, Benachrichtigungen, Multi-Device

research_metadata:
  methodology: >
    Hybrid retrieval: direktes file_search + read_file für alle relevanten Dateien.
    3 Passes: (1) Struktur & Versionen, (2) Feature-Analyse & Schema-Vergleich, (3) Sicherheit & Code-Qualität.
    Alle 4 Versionen vollständig gelesen, Datenbankschema aus SUPABASE-SETUP.md extrahiert.
  scope: >
    Alle 4 Dashboard-Versionen, Root-Vercel-Config, API-Funktion, Daily Routine Kontext-Datei.
    Vollständige Abdeckung aller .tsx, .html, .py, .json, .md Dateien.
  confidence: high
  coverage: 92

