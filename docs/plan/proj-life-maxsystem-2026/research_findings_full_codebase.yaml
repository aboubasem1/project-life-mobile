# ─────────────────────────────────────────────
# CODE QUALITÄT
# ─────────────────────────────────────────────
code_quality:
  issues:
    - id: CQ01
      severity: high
      file: projectdashboardv1/src/App.tsx
      location: App.tsx:~120
      issue: "_allEntries unused variable"
      detail: >
        `const [_allEntries, setAllEntries] = useState<DashboardEntry[]>([])` – 
        Prefix-Unterstrich signalisiert "unused", aber `setAllEntries` wird aufgerufen.
        In StatsView gibt es ein separates `allEntries` state. Die Inkonsistenz deutet auf
        Refactoring-Reste hin.

    - id: CQ02
      severity: high
      file: projectdashboardv1/src/App.tsx
      location: App.tsx:~135
      issue: "void operator auf useState setter"
      detail: >
        `void setAllEntries(allData)` – Der `void` Operator auf einem synchronen Setter macht 
        keinen Sinn und erzeugt verwirrenden Code.

    - id: CQ03
      severity: high
      file: projectdashboardv1/src/App.tsx
      location: App.tsx:StatsView
      issue: "1-Sekunden-Polling für localStorage"
      detail: >
        `setInterval(loadData, 1000)` in StatsView um "in sync" zu bleiben.
        Ineffizient (unnötige JSON-Parseoperationen), erzeugt Batterie-Drain auf Mobile.
        Besser: State-Lifting oder React Context/Zustand statt Polling.

    - id: CQ04
      severity: medium
      file: projectdashboardv1/src/App.tsx
      location: App.tsx:StatsView habits array
      issue: "Keine Memoization bei Streak-Berechnungen"
      detail: >
        `calculateStreakForHabit` und `calculateCompletionRate` werden bei jedem Render
        für alle 11 Habits aufgerufen. Bei vielen Einträgen (>365) merkliche Performance-Einbuße.
        Fix: useMemo für Streaks.

    - id: CQ05
      severity: medium
      file: project-life-dashboard__v1-supabase/web/src/App.tsx
      location: App.tsx:sleepQuality handling
      issue: "sleepQuality Index-zu-String Konvertierung fehleranfällig"
      detail: >
        sleepQuality wird als Zahl (1-5) gespeichert, aber als String aus den sleepQualityOptions
        angezeigt. Index-Berechnung `sleepQualityOptions[entry.sleepQuality - 1]` kann
        `undefined` zurückgeben wenn Wert Out-of-Bounds.

    - id: CQ06
      severity: medium
      file: projectdashboardv1/src/App.tsx
      location: App.tsx:sleepDuration field
      issue: "sleepDuration als Freitext"
      detail: >
        Schlaf-Dauer ist ein Text-Input. User tippt "7h 30m", "7.5", "7:30" – 
        keine Normalisierung, keine Analyse möglich. Sollte number (Dezimalstunden) sein.

    - id: CQ07
      severity: medium
      file: projectdashboardv1/src/App.tsx
      location: App.tsx:DashboardEntry.mood
      issue: "Mood als Emoji-String nicht analysierbar"
      detail: >
        Mood wird als "😊 MOTIVIERT" gespeichert. Für Trendanalyse wäre ein numerischer
        Wert (1-5) und der Text getrennt sinnvoll. Chart.js kann keinen Emoji-String plotten.

    - id: CQ08
      severity: low
      file: all React versions
      issue: "Kein Error Boundary"
      detail: >
        Kein React Error Boundary – ein Fehler in einer Komponente crasht die gesamte App.

    - id: CQ09
      severity: low
      file: project-life-dashboard__v1-supabase/web/src/App.tsx
      location: App.tsx:~117
      issue: "Nur letzte 7 Tage navigierbar"
      detail: >
        `availableDates = getPastDays(7)` – Einträge älter als 7 Tage sind nur im Export
        zugänglich, nicht im UI navigierbar.

    - id: CQ10
      severity: low
      file: api/entries.js
      issue: "In-Memory Map ohne Persistenz"
      detail: >
        `const entries = new Map()` auf Modul-Level – jeder Vercel Cold Start leert alle Daten.
        Funktion ist faktisch non-persistent und täuschend (false sense of API backend).

# ─────────────────────────────────────────────
# SICHERHEIT
# ─────────────────────────────────────────────
domain_security_considerations:
  sensitive_areas:
    - area: Supabase Credentials in build.sh
      location: project-life-dashboard__v1-supabase/build.sh:1-2
      concern: >
        KRITISCH: Supabase URL und Anon Key sind als Klartext in build.sh hardcoded.
        Wenn dieses Repository jemals public wird (GitHub, etc.), sind die Credentials
        sofort kompromittiert. Selbst bei privatem Repo ist das ein schlechtes Muster.
        Fix: Vercel Environment Variables über das Vercel Dashboard setzen.

    - area: Supabase Anon Key in index-clean.html
      location: project-life-dashboard__de/index-clean.html:~84-85
      concern: >
        KRITISCH: Vollständiger Supabase Anon Key als Value im Input-Feld hardcoded.
        Dieser Key ist für jeden sichtbar, der die Seite öffnet (View Source).

    - area: Supabase RLS Policy
      location: SUPABASE-SETUP.md:~70-76
      concern: >
        DEVELOPMENT-POLICY: `CREATE POLICY "Enable all access for development" ON daily_entries
        FOR ALL USING (true) WITH CHECK (true)` – erlaubt JEDEM, der den Anon Key kennt,
        alle Daten zu lesen, schreiben und löschen. Keine User-Authentifizierung.

    - area: CORS-Konfiguration in API
      location: api/entries.js:5-7
      concern: >
        MEDIUM: Access-Control-Allow-Origin: '*' combined with Access-Control-Allow-Credentials: 'true'.
        Browser blockieren das, aber für Nicht-Browser-Clients (curl etc.) problem.

  authentication_patterns_in_domain: >
    Keine Authentifizierung implementiert. Alle Daten sind public durch den Anon Key zugänglich.
    Kein Login, kein User-Account, kein RLS mit echtem User-Kontext.
  authorization_patterns_in_domain: >
    Supabase RLS Policy erlaubt vollen Zugriff ohne Auth. In Produktion werden eigene private
    Health-Daten ohne Schutz gespeichert.
  data_validation_in_domain: >
    Clientseitig: HTML-native min/max auf number inputs (z.B. min="1" max="10").
    Serverseitig: Keine Validierung in api/entries.js (nur date required check).
    Keine Sanitisierung in der Serverless Function.

# ─────────────────────────────────────────────
# UX ANALYSE
# ─────────────────────────────────────────────
ux_issues:
  - id: UX01
    severity: high
    issue: "Kein einheitliches Produkt – 4 Versionen verwirrend"
    detail: >
      User muss wissen welche Version er starten soll.
      projectdashboardv1 ist am besten, aber nicht in Prod deployed.
      Fix: Eine klare Primär-App definieren und anderen Versionen archivieren.

  - id: UX02
    severity: high
    issue: "Daten bleiben im Browser – kein Cloud-Sync in der besten Version"
    detail: >
      Bei Browser-Cache-Clear, neuem Gerät oder Inkognito-Tab sind alle Daten weg.
      Der User muss aktiv exportieren und importieren. Hohe Datenverlust-Gefahr.

  - id: UX03
    severity: high
    issue: "Keine Charts/Visualisierung in der React-App"
    detail: >
      Stats-View zeigt Streak-Zahlen und ein 7-Tage-Grid, aber keine Trend-Linien,
      keine Mood-Kurven, keine Schlaf-Patterns. Chart.js ist bereits installiert aber ungenutzt.

  - id: UX04
    severity: medium
    issue: "Kein Inline-Streak im Eingabe-Dashboard"
    detail: >
      User sieht Streak nur im Stats-Tab. Motivationspsychologisch wichtig wäre
      "🔥 12-Tage-Streak" direkt neben dem Habit-Toggle beim Abhaken.

  - id: UX05
    severity: medium
    issue: "sleepDuration als Freitext unintuitiv"
    detail: >
      User muss selbst entscheiden: "7h30m" oder "7.5" oder "7:30"? Keine Standardisierung.
      Fix: Dezimalzahl-Input in Stunden + automatische hh:mm Anzeige.

  - id: UX06
    severity: medium
    issue: "Mood als Emoji-String ohne visuellen Score"
    detail: >
      "😊 MOTIVIERT" als String zeigt kein Trend-Potential. Im Stats-View können
      Moods nicht auf einer Zeitachse dargestellt werden.

  - id: UX07
    severity: medium
    issue: "Kein Tages-Score / Summary"
    detail: >
      Kein aggregierter Daily Score wie in der Mobile-HTML-Version.
      User sieht Progress-Prozent aber kein "Elite / Stark / Stabil" Label.

  - id: UX08
    severity: medium
    issue: "Morning/Evening Tab-Status nicht persistent"
    detail: >
      Letzte aktiver Tab (Morgens/Abends) wird nicht gespeichert.
      Bei Page-Refresh immer wieder auf 'Morgens'. Abends unbenutzerfreundlich.

  - id: UX09
    severity: low
    issue: "Kein Onboarding für Erstnutzer"
    detail: >
      Leere App mit leeren Feldern, keine Erklärung welche Habits warum tracked werden.
      Fix: Kurzer Onboarding-Screen beim ersten Start.

  - id: UX10
    severity: low
    issue: "Desktop-Layout nicht optimal für >1200px"
    detail: >
      max-width: 920px in CSS. Auf großen Monitoren viel weißer Raum.
      Ein 2-Spalten-Layout für Desktop würde die Nutzfläche besser nutzen.

# ─────────────────────────────────────────────
# ARCHITEKTUR
# ─────────────────────────────────────────────
related_architecture:
  components_relevant_to_domain:
    - component: React + Vite (projectdashboardv1)
      responsibility: Primäre interaktive Oberfläche, localStorage-State-Management
      location: projectdashboardv1/src/
      relationship_to_domain: Hauptkomponente für tägliche Dateneingabe

    - component: Supabase PostgreSQL
      responsibility: Persistente Cloud-Datenbank für daily_entries
      location: extern (Online-Service)
      relationship_to_domain: Backend für mobile HTML-Version und Streamlit, NICHT für React-Primärapp

    - component: Streamlit (Python)
      responsibility: Desktop-Analytics-Dashboard
      location: project-life-dashboard__de/app-supabase.py
      relationship_to_domain: Analytics-Layer, liest von Supabase

    - component: Vercel Edge Network
      responsibility: Static File Hosting + Serverless Functions
      location: vercel.json (root)
      relationship_to_domain: Production Deployment, CDN, API Host

    - component: localStorage (Browser)
      responsibility: Lokale Datenpersistenz
      location: Browser-Storage
      relationship_to_domain: Primärer Datenspeicher in allen React-Versionen

  data_flow_involving_domain: |
    AKTUELL (fragmentiert):
    Mobile HTML → Supabase DB ← Streamlit Python (bidirektional)
    React App (v1-supabase/projectdashboardv1) → localStorage nur (Browser-Silo)
    api/entries.js → in-memory Map (ephemeral, nicht genutzt)

    SOLL (maximales System):
    React PWA → Supabase DB ← Streamlit Analytics (bidirektional, einheitliches Schema)

  key_relationships_to_domain:
    - from: projectdashboardv1
      to: Chart.js
      relationship: imports (installiert, NICHT verwendet)
    - from: project-life-dashboard__v1-supabase
      to: "@supabase/supabase-js"
      relationship: imports (installiert, aber Variablen werden im Code nicht genutzt trotz build.sh)
    - from: project-life-dashboard__de/index.html
      to: Supabase CDN
      relationship: lazy-loads via script tag

related_technology_stack:
  languages_used_in_domain:
    - TypeScript/TSX (React-Apps)
    - HTML/CSS/JavaScript (Vanilla mobile version)
    - Python (Streamlit desktop dashboard)
    - bash (build scripts)
  frameworks_used_in_domain:
    - name: React 19
      usage_in_domain: UI-Komponenten für alle drei React-Versionen
    - name: Vite 7
      usage_in_domain: Build tool + Dev server
    - name: TypeScript ~5.9
      usage_in_domain: Type safety in allen React-Versionen
    - name: Tailwind CSS (config vorhanden)
      usage_in_domain: tailwind.config.js existiert, aber postcss/tw wird nur in __de/__v1 genutzt, NICHT in projectdashboardv1
    - name: Streamlit
      usage_in_domain: Python-basiertes UI-Framework für Analytics
  libraries_used_in_domain:
    - name: Chart.js ^4.5.1
      purpose_in_domain: Datenvisualisierung – installiert in projectdashboardv1 aber NICHT verwendet
    - name: "@supabase/supabase-js ^2.95.3"
      purpose_in_domain: Supabase Client – installiert in v1-supabase aber faktisch nicht genutzt
    - name: pandas, supabase (Python)
      purpose_in_domain: Datenanalyse und DB-Zugriff in Streamlit

# ─────────────────────────────────────────────
# OPTIMIERUNGS-ROADMAP (MAXIMUM SYSTEM)
# ─────────────────────────────────────────────
optimization_roadmap:
  phase_1_critical_security:
    priority: P0
    effort: 1-2 Stunden
    items:
      - "Supabase Credentials aus build.sh und index-clean.html entfernen"
      - "Vercel Environment Variables über Vercel Dashboard setzen"
      - "Supabase RLS Policy auf User-basierte Auth umstellen"
      - ".gitignore für .env Dateien prüfen"

  phase_2_consolidate_architecture:
    priority: P1
    effort: 1 Tag
    items:
      - "projectdashboardv1 als einzige aktive Version definieren"
      - "Alten Versionen in /archive/ verschieben"
      - "Root vercel.json auf projectdashboardv1 umzeigen"
      - "Einheitliches Datenschema definieren (React-Schema als Basis, Plus-Felder hinzufügen)"

  phase_3_extend_data_model:
    priority: P1
    effort: 2-3 Stunden
    items:
      - "weight_kg Feld hinzufügen"
      - "waterLiters Feld hinzufügen"
      - "deepWorkMinutes Feld hinzufügen"
      - "journalText Feld ändern (boolean → text)"
      - "focusGoal (text) Feld hinzufügen"
      - "sleepDuration: Freitext → number (Dezimalstunden)"
      - "mood: string → number (1-5) + displayLabel"
      - "sleepQuality: number 1-5 konsistent machen"

  phase_4_cloud_sync:
    priority: P1
    effort: 1 Tag
    items:
      - "Supabase Integration in projectdashboardv1 aktivieren"
      - "Supabase-Schema an neues einheitliches Schema anpassen"
      - "Offline-First: localStorage als Cache, Supabase als Source of Truth"
      - "Conflict Resolution bei Multi-Device-Sync"

  phase_5_charts_and_analytics:
    priority: P2
    effort: 1-2 Tage
    items:
      - "Chart.js in StatsView nutzen (ist bereits installiert!)"
      - "Mood-Trend-Linie (letzte 30 Tage)"
      - "Schlaf-Qualität-Trend"
      - "Protein/Kalorien Balkendiagramm"
      - "Tages-Score-Verlauf"
      - "Custom Streak-Heatmap (GitHub-style) für 3 Monate"

  phase_6_gamification_score:
    priority: P2
    effort: 4-6 Stunden
    items:
      - "Daily Score System (Zone A + Mindset + Recovery) aus mobile-Version portieren"
      - "Elite/Stark/Stabil Label + Badge im Dashboard"
      - "Weekly Summary: Bester Tag der Woche"
      - "Inline Streak Counter neben jedem Habit-Toggle"

  phase_7_pwa:
    priority: P3
    effort: 1 Tag
    items:
      - "manifest.json erstellen (App-Name, Icons, Theme-Color)"
      - "Service Worker für Offline-Fähigkeit"
      - "Add-to-Home-Screen auf iPhone"
      - "Push Notifications für Morgen/Abend-Routine (optional)"

  phase_8_ux_polish:
    priority: P3
    effort: 4-6 Stunden
    items:
      - "localStorage-Polling durch React Context + Event-basiertes Update ersetzen"
      - "Morning/Evening Tab-State persistent machen (sessionStorage)"
      - "Desktop 2-Spalten-Layout bei >1200px"
      - "Empty State Onboarding für neue User"
      - "Error Boundary hinzufügen"
      - "useMemo für Streak-Berechnungen"

# ─────────────────────────────────────────────
# OFFENE FRAGEN
# ─────────────────────────────────────────────
open_questions:
  - question: "Welche Version soll die zentrale Primär-App werden?"
    context: >
      projectdashboardv1 hat das beste UX und Stats-View, aber ist nicht in Prod.
      v1-supabase hat die bessere Wochenübersicht. Sollen Features zusammengeführt werden?

  - question: "Soll die Streamlit/Python-Komponente beibehalten werden?"
    context: >
      Streamlit erfordert separaten Server/Python-Env. Wenn alle Analytics in die React-App
      integriert werden, ist Streamlit redundant.

  - question: "Welches Schema soll das 'maximale System' verwenden?"
    context: >
      Mobile HTML-Schema ist umfangreicher (Gewicht, Fokus-Ziel, Score-System).
      React-Schema ist einfacher aber besser strukturiert. Unified Schema müsste beide vereinen.

  - question: "Soll Auth (Login) implementiert werden?"
    context: >
      Aktuell keine Authentifizierung. Mit Supabase Auth können Multi-User, Privacy,
      und sichere RLS-Policies implementiert werden. Für den persönlichen Use-Case
      könnte ein einfacher Magic-Link-Login ausreichen.

  - question: "Wo sollen historische Daten (aus bestehenden localStorage-Einträgen) migriert werden?"
    context: >
      User hat möglicherweise bereits Einträge im localStorage.
      Bei Schema-Erweiterung und Cloud-Sync müssen alte Daten migriert werden.

gaps:
  - area: Test Coverage
    description: Kein einziger Test (Unit, Integration, E2E) in irgendeiner Version
    impact: Refactoring-Risiko bei Schema-Änderungen, keine Regressionsabsicherung

  - area: Build/CI Pipeline
    description: >
      Kein automatisierter Build außer manuelles `npm run build`.
      Kein Lint in CI, kein Type-Check in CI-Gate.
    impact: Build-Fehler werden erst bei Deployment entdeckt

  - area: Error Tracking
    description: Kein Sentry oder ähnliches Error Monitoring in Produktion
    impact: Produktionsfehler werden vom User nicht an Entwickler gemeldet

  - area: Offline/Network Error Handling
    description: >
      In der HTML-Mobile-Version wird bei Supabase-Fehler nur ein Status angezeigt,
      aber keine Offline-Queue für später-Sync.
    impact: Bei schlechter Verbindung gehen Eingaben verloren

  - area: Data Migration Strategy
    description: Kein Migrations-Script für Schema-Änderungen zwischen Versionen
    impact: Zukünftige Schema-Änderungen sind manuell und fehleranfällig
