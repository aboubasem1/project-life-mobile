<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Life Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f1115; 
      color: #e8e8ea; 
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .status.ok { color: #2ecc71; background: #0d2818; }
    .status.error { color: #ff6b6b; background: #2a1515; }
    .status.syncing { color: #4f8cff; background: #0f1a2e; }
    .card {
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    h3 { margin-bottom: 15px; }
    label {
      display: block;
      color: #a9b0bb;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      background: #0f1218;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input[type="checkbox"] { width: auto; }
    button {
      width: 100%;
      padding: 14px;
      background: #4f8cff;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3d7ae8; }
    .btn-success { background: #2ecc71; }
    .btn-success:hover { background: #27ae60; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Project Life Dashboard</h1>
    <div class="status ok" id="status">✓ Bereit</div>

    <!-- App DIREKT SICHTBAR -->
    <div id="appSection">
      <div class="card">
        <h3>🌅 Morgen Routine</h3>
        <label>📅 Datum</label>
        <input type="date" id="datum" />
        
        <label>😊 Stimmung beim Aufwachen</label>
        <select id="stimmung" style="width: 100%; padding: 12px; background: #0f1218; border: 1px solid #2a2f3a; border-radius: 8px; color: #e8e8ea; font-size: 14px; margin-bottom: 12px;">
          <option value="">-- Auswählen --</option>
          <option value="sehr_gut">😄 Sehr gut</option>
          <option value="gut">🙂 Gut</option>
          <option value="neutral">😐 Neutral</option>
          <option value="schlecht">😕 Schlecht</option>
          <option value="sehr_schlecht">😞 Sehr schlecht</option>
        </select>
        
        <label>😴 Schlafqualität</label>
        <select id="schlaf" style="width: 100%; padding: 12px; background: #0f1218; border: 1px solid #2a2f3a; border-radius: 8px; color: #e8e8ea; font-size: 14px; margin-bottom: 12px;">
          <option value="">-- Auswählen --</option>
          <option value="sehr_gut">⭐⭐⭐⭐⭐ Sehr gut</option>
          <option value="gut">⭐⭐⭐⭐ Gut</option>
          <option value="ok">⭐⭐⭐ OK</option>
          <option value="schlecht">⭐⭐ Schlecht</option>
          <option value="sehr_schlecht">⭐ Sehr schlecht</option>
        </select>
        <label>⏰ Schlafdauer</label>
        <select id="schlafdauer" style="width: 100%; padding: 12px; background: #0f1218; border: 1px solid #2a2f3a; border-radius: 8px; color: #e8e8ea; font-size: 14px; margin-bottom: 12px;">
          <option value="">-- Auswählen --</option>
          <option value="<5">Weniger als 5h</option>
          <option value="5-6">5-6h</option>
          <option value="6-7">6-7h</option>
          <option value="7-8">7-8h</option>
          <option value=">8">Mehr als 8h</option>
        </select>
        <label>🏋️ Workout Daily 50</label>
        <div style="margin-bottom:12px;">
          <input type="checkbox" id="pushups" /> 50 Pushups <span style="font-weight:600;color:#2ecc71;">Done</span><br>
          <input type="checkbox" id="squats" /> 50 Squats <span style="font-weight:600;color:#2ecc71;">Done</span><br>
          <input type="checkbox" id="wallsit" /> 50 Sek Wallsit <span style="font-weight:600;color:#2ecc71;">Done</span><br>
          <input type="checkbox" id="plank" /> 50 Sek Plank <span style="font-weight:600;color:#2ecc71;">Done</span>
        </div>
        <label>🙏 Dankbarkeit</label>
        <input type="checkbox" id="dankbarkeit" /> Done
        <label>🎯 Fokus</label>
        <input type="checkbox" id="fokus" /> Done
        <label>🏆 Winner Mode</label>
        <input type="checkbox" id="winner_mode" /> Done
        
        <label>🧘 Meditation (Min)</label>
        <input type="number" id="meditation" min="0" step="5" placeholder="15" />
        
        <label>🥶 Cold Shower</label>
        <input type="checkbox" id="cold_shower" /> Done
        
        <label>🥤 Protein Shake</label>
        <input type="checkbox" id="protein_shake" /> Done
        
        <button class="btn-success" onclick="saveMorgen()">💾 Morgen speichern</button>
      </div>

      <div class="card">
        <h3>🌙 Abend Routine</h3>
        
        <label>🍖 Protein (g)</label>
        <input type="number" id="protein" min="0" step="10" placeholder="150" />
        
        <label>🔥 Kalorien</label>
        <input type="number" id="kalorien" min="0" step="100" placeholder="2500" />
        <label>✅ Aufgaben erledigt</label>
          <input type="number" id="aufgaben" min="0" step="1" placeholder="0" />
        <label>📖 Journal</label>
        <input type="checkbox" id="journal" /> Done
        <label>👨‍👩‍👧‍👦 Family Time</label>
        <input type="checkbox" id="family_time" /> Done
        <button class="btn-success" onclick="saveAbend()">💾 Abend speichern</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // AUTO-CONNECT - KEIN LOGIN NÖTIG
    const supabase = window.supabase.createClient(
      'https://jdsojjjrxsknffuogdux.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkc29qampyeHNrbmZmdW9nZHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjEwNjMsImV4cCI6MjA4NjgzNzA2M30.zPPzQev60bopgiBlenNAezIsYfNg8m5IMAigfsDGIhs'
    );
    
    function setStatus(text, type) {
      document.getElementById('status').textContent = text;
      document.getElementById('status').className = 'status ' + type;
    }
    
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('datum').value = new Date().toISOString().split('T')[0];
      await loadData();
    });
    
    async function loadData() {
      const datum = document.getElementById('datum').value;
      if (!datum) return;
      
      try {
        setStatus('Lade Daten...', 'syncing');
        const { data, error } = await supabase
          .from('daily_entries')
          .select('*')
          .eq('datum', datum)
          .single();
        
        if (error && error.code !== 'PGRST116') {
          console.error('Fehler beim Laden:', error);
          setStatus('✓ Bereit', 'ok');
          return;
        }
        
        if (data) {
          // Morgen Daten
          document.getElementById('stimmung').value = data.stimmung || '';
          document.getElementById('schlaf').value = data.schlafqualitaet || '';
          document.getElementById('meditation').value = data.meditation_min || '';
          document.getElementById('cold_shower').checked = data.cold_shower || false;
          document.getElementById('protein_shake').checked = data.protein_shake || false;
          document.getElementById('schlafdauer').value = data.schlafdauer || '';
          document.getElementById('workout50').checked = data.workout50 || false;
          document.getElementById('dankbarkeit').checked = data.dankbarkeit || false;
          document.getElementById('fokus').checked = data.fokus || false;
          document.getElementById('winner_mode').checked = data.winner_mode || false;
          // Abend Daten
          document.getElementById('protein').value = data.protein_gramm || '';
          document.getElementById('kalorien').value = data.kalorien || '';
            document.getElementById('aufgaben').value = data.aufgaben || '';
          document.getElementById('journal').checked = data.journal || false;
          document.getElementById('family_time').checked = data.family_time || false;
          setStatus('✓ Daten geladen', 'ok');
        } else {
          setStatus('✓ Bereit', 'ok');
        }
      } catch (err) {
        console.error('Fehler:', err);
        setStatus('✓ Bereit', 'ok');
      }
    }
    
    // Datum Change Event
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('datum').addEventListener('change', loadData);
    });
    
    async function saveMorgen() {
      const datum = document.getElementById('datum').value;
      if (!datum) {
        alert('❌ Bitte Datum wählen!');
        return;
      }
      
      try {
        setStatus('Speichere...', 'syncing');
        
        const updates = {
          datum: datum,
          stimmung: document.getElementById('stimmung').value || null,
          schlafqualitaet: document.getElementById('schlaf').value || null,
          schlafdauer: document.getElementById('schlafdauer').value || null,
          meditation_min: parseInt(document.getElementById('meditation').value) || null,
          cold_shower: document.getElementById('cold_shower').checked,
          protein_shake: document.getElementById('protein_shake').checked,
          workout50: document.getElementById('workout50').checked,
            pushups: document.getElementById('pushups').checked,
            squats: document.getElementById('squats').checked,
            wallsit: document.getElementById('wallsit').checked,
            plank: document.getElementById('plank').checked,
          dankbarkeit: document.getElementById('dankbarkeit').checked,
          fokus: document.getElementById('fokus').checked,
          winner_mode: document.getElementById('winner_mode').checked
        };
        
        const { error } = await supabase
          .from('daily_entries')
          .upsert(updates, { onConflict: 'datum' });
        
        if (error) {
          alert('❌ Speicherfehler:\n' + error.message);
          setStatus('Fehler', 'error');
        } else {
          alert('✅ Morgen-Daten gespeichert!');
          setStatus('✓ Gespeichert', 'ok');
        }
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', 'error');
      }
    }
    
    async function saveAbend() {
      const datum = document.getElementById('datum').value;
      if (!datum) {
        alert('❌ Bitte Datum wählen!');
        return;
      }
      
      try {
        setStatus('Speichere...', 'syncing');
        
        const updates = {
          datum: datum,
          protein_gramm: parseInt(document.getElementById('protein').value) || null,
          kalorien: parseInt(document.getElementById('kalorien').value) || null,
          aufgaben: parseInt(document.getElementById('aufgaben').value) || null,
          journal: document.getElementById('journal').checked,
          family_time: document.getElementById('family_time').checked
        };
        
        const { error } = await supabase
          .from('daily_entries')
          .upsert(updates, { onConflict: 'datum' });
        
        if (error) {
          alert('❌ Speicherfehler:\n' + error.message);
          setStatus('Fehler', 'error');
        } else {
          alert('✅ Abend-Daten gespeichert!');
          setStatus('✓ Gespeichert', 'ok');
        }
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', 'error');
      }
    }
  </script>
</body>
</html>
