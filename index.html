<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Life Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f1115; 
      color: #e8e8ea; 
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .status.ok { color: #2ecc71; background: #0d2818; }
    .status.error { color: #ff6b6b; background: #2a1515; }
    .status.syncing { color: #4f8cff; background: #0f1a2e; }
    .card {
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    h3 { margin-bottom: 15px; }
    label {
      display: block;
      color: #a9b0bb;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      background: #0f1218;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input[type="checkbox"] { width: auto; }
    button {
      width: 100%;
      padding: 14px;
      background: #4f8cff;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3d7ae8; }
    .btn-success { background: #2ecc71; }
    .btn-success:hover { background: #27ae60; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Project Life Dashboard</h1>
    <div class="status ok" id="status">✓ Bereit</div>

    <!-- App DIREKT SICHTBAR -->
    <div id="appSection">
      <div class="card">
        <label>Datum</label>
        <input type="date" id="datum" />
        
        <label>Training?</label>
        <input type="checkbox" id="training" /> Ja
        
        <label>Meditation (Min)</label>
        <input type="number" id="meditation" min="0" />
        
        <label>Notizen</label>
        <textarea id="notizen" rows="3"></textarea>
        
        <button class="btn-success" onclick="saveDaten()">Daten speichern</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // AUTO-CONNECT - KEIN LOGIN NÖTIG
    const supabase = window.supabase.createClient(
      'https://jdsojjjrxsknffuogdux.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkc29qampyeHNrbmZmdW9nZHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjEwNjMsImV4cCI6MjA4NjgzNzA2M30.zPPzQev60bopgiBlenNAezIsYfNg8m5IMAigfsDGIhs'
    );
    
    function setStatus(text, type) {
      document.getElementById('status').textContent = text;
      document.getElementById('status').className = 'status ' + type;
    }
    
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('datum').value = new Date().toISOString().split('T')[0];
      setStatus('✓ Bereit', 'ok');
    });
    
    async function saveDaten() {
      const datum = document.getElementById('datum').value;
      const training = document.getElementById('training').checked;
      const meditation = parseInt(document.getElementById('meditation').value) || null;
      const notizen = document.getElementById('notizen').value;
      
      if (!datum) {
        alert('❌ Bitte Datum wählen!');
        return;
      }
      
      try {
        setStatus('Speichere...', 'syncing');
        
        const { data, error } = await supabase
          .from('daily_entries')
          .upsert({
            datum: datum,
            training: training,
            meditation_min: meditation,
            notes: notizen
          }, { onConflict: 'datum' })
          .select();
        
        if (error) {
          alert('❌ Speicherfehler:\n' + error.message);
          setStatus('Fehler', 'error');
        } else {
          alert('✅ Daten gespeichert!');
          setStatus('✓ Gespeichert', 'ok');
        }
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', 'error');
      }
    }
  </script>
</body>
</html>
