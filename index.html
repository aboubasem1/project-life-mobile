<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Life Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f1115; 
      color: #e8e8ea; 
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { margin-bottom: 10px; }
    .status { 
      display: inline-block;
      padding: 4px 10px; 
      border-radius: 6px; 
      background: #1a1d27;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .status.ok { color: #2ecc71; }
    .status.error { color: #ff6b6b; }
    .card { 
      background: #171a21; 
      border: 1px solid #2a2f3a; 
      border-radius: 12px; 
      padding: 20px; 
      margin-bottom: 15px;
    }
    label { 
      display: block; 
      color: #a9b0bb; 
      font-size: 13px; 
      margin-bottom: 6px; 
    }
    input, textarea { 
      width: 100%; 
      padding: 12px; 
      background: #0f1218; 
      border: 1px solid #2a2f3a; 
      border-radius: 8px; 
      color: #e8e8ea; 
      font-size: 14px;
      margin-bottom: 12px;
    }
    button { 
      width: 100%; 
      padding: 14px; 
      background: #4f8cff; 
      border: none; 
      border-radius: 8px; 
      color: white; 
      font-size: 15px; 
      font-weight: 600; 
      cursor: pointer;
    }
    button:hover { background: #3d7ae8; }
    .btn-success { background: #2ecc71; }
    .btn-success:hover { background: #27ae60; }
    #configSection.hidden { display: none; }
    #appSection.hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Project Life Dashboard</h1>
    <div class="status" id="status">Nicht konfiguriert</div>

    <!-- Konfigurations-Sektion -->
    <div id="configSection">
      <div class="card">
        <h3>⚙️ Supabase Konfiguration</h3>
        <label>Supabase URL</label>
        <input type="text" id="url" value="https://jdsojjjrxsknffuogdux.supabase.co" />
        
        <label>Supabase Key</label>
        <input type="text" id="key" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkc29qampyeHNrbmZmdW9nZHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjEwNjMsImV4cCI6MjA4NjgzNzA2M30.zPPzQev60bopgiBlenNAezIsYfNg8m5IMAigfsDGIhs" />
        
        <button onclick="connectSupabase()">Verbinden & Testen</button>
      </div>
    </div>

    <!-- App-Sektion -->
    <div id="appSection" class="hidden">
      <div class="card">
        <label>Datum</label>
        <input type="date" id="datum" />
        
        <label>Training?</label>
        <input type="checkbox" id="training" style="width: auto;" /> Ja
        
        <label>Meditation (Min)</label>
        <input type="number" id="meditation" min="0" />
        
        <label>Notizen</label>
        <textarea id="notizen" rows="3"></textarea>
        
        <button class="btn-success" onclick="saveDaten()">Daten speichern</button>
      </div>
      
      <button onclick="showConfig()">⚙️ Konfiguration ändern</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    console.log('🚀 Script lädt...');
    let supabase = null;
    const statusEl = document.getElementById('status');
    
    // Beim Laden: Prüfe ob Config vorhanden
    window.addEventListener('DOMContentLoaded', () => {
      console.log('✅ DOMContentLoaded');
      alert('✅ Seite geladen! Supabase: ' + (typeof window.supabase !== 'undefined' ? 'JA' : 'NEIN'));
      const saved = localStorage.getItem('supabaseConfig');
      if (saved) {
        const config = JSON.parse(saved);
        document.getElementById('url').value = config.url;
        document.getElementById('key').value = config.key;
        autoConnect(config.url, config.key);
      }
      
      // Setze heutiges Datum
      document.getElementById('datum').value = new Date().toISOString().split('T')[0];
    });
    
    function setStatus(text, isOk) {
      statusEl.textContent = text;
      statusEl.className = 'status ' + (isOk ? 'ok' : 'error');
    }
    
    async function autoConnect(url, key) {
      try {
        supabase = window.supabase_js.createClient(url, key);
        const { error } = await supabase.from('daily_entries').select('datum').limit(1);
        
        if (error) {
          setStatus('Verbindung fehlgeschlagen', false);
        } else {
          setStatus('✓ Verbunden', true);
          document.getElementById('configSection').classList.add('hidden');
          document.getElementById('appSection').classList.remove('hidden');
        }
      } catch (err) {
        setStatus('Fehler: ' + err.message, false);
      }
    }
    
    async function connectSupabase() {
      console.log('🔵 connectSupabase() aufgerufen');
      alert('🔵 connectSupabase() startet...');
      
      const url = document.getElementById('url').value.trim();
      const key = document.getElementById('key').value.trim();
      
      console.log('URL:', url);
      console.log('Key (first 20):', key.substring(0, 20));
      
      if (!url || !key) {
        alert('❌ Bitte beide Felder ausfüllen!');
        return;
      }
      
      try {
        setStatus('Verbinde...', false);
        alert('⏳ Erstelle Supabase Client...');
        
        // Erstelle Client
        console.log('Checking window.supabase:', typeof window.supabase);
        supabase = window.supabase.createClient(url, key);
        console.log('✅ Client erstellt:', supabase);
        alert('✅ Client erstellt!');
        console.log('✅ Client erstellt:', supabase);
        alert('✅ Client erstellt!');
        
        // Teste Verbindung
        alert('⏳ Teste Datenbankverbindung...');
        const { data, error } = await supabase
          .from('daily_entries')
          .select('datum')
          .limit(1);
        
        console.log('DB Response - Data:', data);
        console.log('DB Response - Error:', error);
        
        if (error) {
          alert('❌ Datenbankfehler:\n' + error.message);
          setStatus('Fehler', false);
          return;
        }
        
        // Erfolg!
        alert('✅ Verbindung erfolgreich!\n\nGefundene Einträge: ' + (data ? data.length : 0));
        
        // Speichere Config
        localStorage.setItem('supabaseConfig', JSON.stringify({ url, key }));
        
        setStatus('✓ Verbunden', true);
        document.getElementById('configSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', false);
        console.error(err);
      }
    }
    
    async function saveDaten() {
      if (!supabase) {
        alert('❌ Keine Verbindung!');
        return;
      }
      
      const datum = document.getElementById('datum').value;
      const training = document.getElementById('training').checked;
      const meditation = parseInt(document.getElementById('meditation').value) || null;
      const notizen = document.getElementById('notizen').value;
      
      if (!datum) {
        alert('❌ Bitte Datum wählen!');
        return;
      }
      
      try {
        setStatus('Speichere...', false);
        
        const { data, error } = await supabase
          .from('daily_entries')
          .upsert({
            datum: datum,
            training: training,
            meditation_min: meditation,
            notes: notizen
          }, { onConflict: 'datum' })
          .select();
        
        if (error) {
          alert('❌ Speicherfehler:\n' + error.message);
          setStatus('Fehler', false);
        } else {
          alert('✅ Daten gespeichert!');
          setStatus('✓ Gespeichert', true);
        }
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', false);
        console.error(err);
      }
    }
    
    function showConfig() {
      document.getElementById('configSection').classList.remove('hidden');
      document.getElementById('appSection').classList.add('hidden');
    }
  </script>
</body>
</html>
