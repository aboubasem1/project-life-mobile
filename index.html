<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Life Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, system-ui, sans-serif;
      background: #0f1115; 
      color: #e8e8ea; 
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { margin-bottom: 20px; }
    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .status.ok { color: #2ecc71; background: #0d2818; }
    .status.error { color: #ff6b6b; background: #2a1515; }
    .status.syncing { color: #4f8cff; background: #0f1a2e; }
    .card {
      background: #171a21;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
    }
    h3 { margin-bottom: 15px; }
    label {
      display: block;
      color: #a9b0bb;
      font-size: 13px;
      margin-bottom: 6px;
      font-weight: 500;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      background: #0f1218;
      border: 1px solid #2a2f3a;
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 14px;
      margin-bottom: 12px;
    }
    input[type="checkbox"] { width: auto; }
    button {
      width: 100%;
      padding: 14px;
      background: #4f8cff;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #3d7ae8; }
    .btn-success { background: #2ecc71; }
    .btn-success:hover { background: #27ae60; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Project Life Dashboard</h1>
    <div class="status ok" id="status">✓ Bereit</div>

    <!-- App DIREKT SICHTBAR -->
    <div id="appSection">
      <div class="card">
        <h3>🌅 Morgen Routine</h3>
        <label>📅 Datum</label>
        <input type="date" id="datum" />
        
        <label>🧘 Meditation (Min)</label>
        <input type="number" id="meditation" min="0" step="5" placeholder="15" />
        
        <label>🥶 Cold Shower</label>
        <input type="checkbox" id="cold_shower" /> Erledigt
        
        <label>🥤 Protein Shake</label>
        <input type="checkbox" id="protein_shake" /> Getrunken
        
        <label>🎯 Deep Work Session 1 (Min)</label>
        <input type="number" id="deep_work_1" min="0" step="15" placeholder="60" />
        
        <label>🎯 Deep Work Session 2 (Min)</label>
        <input type="number" id="deep_work_2" min="0" step="15" placeholder="60" />
        
        <button class="btn-success" onclick="saveMorgen()">💾 Morgen speichern</button>
      </div>

      <div class="card">
        <h3>🌙 Abend Routine</h3>
        
        <label>💪 Training</label>
        <input type="checkbox" id="training" /> Erledigt
        
        <label>🚶 Schritte</label>
        <input type="number" id="schritte" min="0" step="100" placeholder="10000" />
        
        <label>🍖 Protein (g)</label>
        <input type="number" id="protein" min="0" step="10" placeholder="150" />
        
        <label>📱 Bildschirmzeit (Min)</label>
        <input type="number" id="bildschirm" min="0" step="15" placeholder="120" />
        
        <label>💧 Wasser (L)</label>
        <input type="number" id="wasser" min="0" step="0.5" placeholder="3.0" />
        
        <label>📖 Journal</label>
        <input type="checkbox" id="journal" /> Geschrieben
        
        <label>📚 Gelesen (Min)</label>
        <input type="number" id="reading" min="0" step="10" placeholder="30" />
        
        <button class="btn-success" onclick="saveAbend()">💾 Abend speichern</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // AUTO-CONNECT - KEIN LOGIN NÖTIG
    const supabase = window.supabase.createClient(
      'https://jdsojjjrxsknffuogdux.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkc29qampyeHNrbmZmdW9nZHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjEwNjMsImV4cCI6MjA4NjgzNzA2M30.zPPzQev60bopgiBlenNAezIsYfNg8m5IMAigfsDGIhs'
    );
    
    function setStatus(text, type) {
      document.getElementById('status').textContent = text;
      document.getElementById('status').className = 'status ' + type;
    }
    
    window.addEventListener('DOMContentLoaded', async () => {
      document.getElementById('datum').value = new Date().toISOString().split('T')[0];
      await loadData();
    });
    
    async function loadData() {
      const datum = document.getElementById('datum').value;
      if (!datum) return;
      
      try {
        setStatus('Lade Daten...', 'syncing');
        const { data, error } = await supabase
          .from('daily_entries')
          .select('*')
          .eq('datum', datum)
          .single();
        
        if (error && error.code !== 'PGRST116') {
          console.error('Fehler beim Laden:', error);
          setStatus('✓ Bereit', 'ok');
          return;
        }
        
        if (data) {
          // Morgen Daten
          document.getElementById('meditation').value = data.meditation_min || '';
          document.getElementById('cold_shower').checked = data.cold_shower || false;
          document.getElementById('protein_shake').checked = data.protein_shake || false;
          document.getElementById('deep_work_1').value = data.deep_work_1_min || '';
          document.getElementById('deep_work_2').value = data.deep_work_2_min || '';
          
          // Abend Daten
          document.getElementById('training').checked = data.training || false;
          document.getElementById('schritte').value = data.schritte || '';
          document.getElementById('protein').value = data.protein_gramm || '';
          document.getElementById('bildschirm').value = data.bildschirmzeit_min || '';
          document.getElementById('wasser').value = data.wasser_liter || '';
          document.getElementById('journal').checked = data.journal || false;
          document.getElementById('reading').value = data.reading_min || '';
          
          setStatus('✓ Daten geladen', 'ok');
        } else {
          setStatus('✓ Bereit', 'ok');
        }
      } catch (err) {
        console.error('Fehler:', err);
        setStatus('✓ Bereit', 'ok');
      }
    }
    
    // Datum Change Event
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('datum').addEventListener('change', loadData);
    });
    
    async function saveMorgen() {
      const datum = document.getElementById('datum').value;
      if (!datum) {
        alert('❌ Bitte Datum wählen!');
        return;
      }
      
      try {
        setStatus('Speichere...', 'syncing');
        
        const updates = {
          datum: datum,
          meditation_min: parseInt(document.getElementById('meditation').value) || null,
          cold_shower: document.getElementById('cold_shower').checked,
          protein_shake: document.getElementById('protein_shake').checked,
          deep_work_1_min: parseInt(document.getElementById('deep_work_1').value) || null,
          deep_work_2_min: parseInt(document.getElementById('deep_work_2').value) || null
        };
        
        const { error } = await supabase
          .from('daily_entries')
          .upsert(updates, { onConflict: 'datum' });
        
        if (error) {
          alert('❌ Speicherfehler:\n' + error.message);
          setStatus('Fehler', 'error');
        } else {
          alert('✅ Morgen-Daten gespeichert!');
          setStatus('✓ Gespeichert', 'ok');
        }
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', 'error');
      }
    }
    
    async function saveAbend() {
      const datum = document.getElementById('datum').value;
      if (!datum) {
        alert('❌ Bitte Datum wählen!');
        return;
      }
      
      try {
        setStatus('Speichere...', 'syncing');
        
        const updates = {
          datum: datum,
          training: document.getElementById('training').checked,
          schritte: parseInt(document.getElementById('schritte').value) || null,
          protein_gramm: parseInt(document.getElementById('protein').value) || null,
          bildschirmzeit_min: parseInt(document.getElementById('bildschirm').value) || null,
          wasser_liter: parseFloat(document.getElementById('wasser').value) || null,
          journal: document.getElementById('journal').checked,
          reading_min: parseInt(document.getElementById('reading').value) || null
        };
        
        const { error } = await supabase
          .from('daily_entries')
          .upsert(updates, { onConflict: 'datum' });
        
        if (error) {
          alert('❌ Speicherfehler:\n' + error.message);
          setStatus('Fehler', 'error');
        } else {
          alert('✅ Abend-Daten gespeichert!');
          setStatus('✓ Gespeichert', 'ok');
        }
      } catch (err) {
        alert('❌ Fehler:\n' + err.message);
        setStatus('Fehler', 'error');
      }
    }
  </script>
</body>
</html>
