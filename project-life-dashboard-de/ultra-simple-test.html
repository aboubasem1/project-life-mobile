<!DOCTYPE html>
<html>
<head>
  <title>ULTRA SIMPLE TEST</title>
</head>
<body style="background: black; color: white; padding: 50px; font-size: 20px;">
  <h1>ULTRA SIMPLE TEST</h1>
  <button onclick="test1()" style="padding: 20px; font-size: 18px; margin: 10px;">TEST 1: Alert</button>
  <button onclick="test2()" style="padding: 20px; font-size: 18px; margin: 10px;">TEST 2: Console</button>
  <button onclick="test3()" style="padding: 20px; font-size: 18px; margin: 10px;">TEST 3: Supabase</button>
  
  <div id="output" style="margin-top: 30px; padding: 20px; background: #333;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function test1() {
      alert('TEST 1 FUNKTIONIERT!');
    }
    
    function test2() {
      document.getElementById('output').innerHTML = 'TEST 2 FUNKTIONIERT!';
      console.log('TEST 2 in Console');
    }
    
    async function test3() {
      document.getElementById('output').innerHTML = 'STARTE TEST 3...';
      
      try {
        if (typeof window.supabase === 'undefined') {
          document.getElementById('output').innerHTML = '❌ SUPABASE NICHT GELADEN!';
          alert('❌ SUPABASE NICHT GELADEN!');
          return;
        }
        
        document.getElementById('output').innerHTML = '✅ Supabase geladen, erstelle Client...';
        
        const client = window.supabase.createClient(
          'https://jdsojjjrxsknffuogdux.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impkc29qampyeHNrbmZmdW9nZHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEyNjEwNjMsImV4cCI6MjA4NjgzNzA2M30.zPPzQev60bopgiBlenNAezIsYfNg8m5IMAigfsDGIhs'
        );
        
        document.getElementById('output').innerHTML = '✅ Client erstellt, teste DB...';
        
        const { data, error } = await client.from('daily_entries').select('*').limit(1);
        
        if (error) {
          document.getElementById('output').innerHTML = '❌ DB FEHLER: ' + error.message;
          alert('❌ DB FEHLER: ' + error.message);
        } else {
          document.getElementById('output').innerHTML = '✅✅✅ ALLES FUNKTIONIERT! Einträge: ' + JSON.stringify(data);
          alert('✅ ERFOLG! Daten: ' + JSON.stringify(data));
        }
      } catch (err) {
        document.getElementById('output').innerHTML = '❌ FEHLER: ' + err.message;
        alert('❌ FEHLER: ' + err.message);
      }
    }
  </script>
</body>
</html>
