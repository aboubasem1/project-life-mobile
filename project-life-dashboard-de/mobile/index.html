<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Life – Mobile</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8e8ea;
      --muted: #a9b0bb;
      --accent: #4f8cff;
      --accent-2: #2ecc71;
      --danger: #ff6b6b;
      --border: #2a2f3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 16px 16px 8px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 2;
    }
    h1 { margin: 0 0 8px; font-size: 20px; }
    .muted { color: var(--muted); font-size: 12px; }
    .container { padding: 12px 16px 80px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f1218;
      color: var(--text);
      font-size: 14px;
    }
    textarea { min-height: 70px; resize: vertical; }
    .row { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row-3 { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f1218;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    .toggle input { width: auto; }
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab {
      padding: 10px;
      text-align: center;
      border-radius: 10px;
      background: #0f1218;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      border: 0;
      padding: 12px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: var(--accent-2); color: #0b1a10; }
    .btn-danger { background: var(--danger); color: #2b0f0f; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
    }
    .tiny { font-size: 11px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>Project Life – Mobile</h1>
    <div class="muted">Offline, lokal gespeichert (localStorage)</div>
  </header>

  <div class="container">
    <div class="card">
      <label>Datum</label>
      <input type="date" id="entryDate" />
      <div class="tiny">Tipp: morgens und abends am gleichen Datum speichern.</div>
    </div>

    <div class="tabs">
      <div class="tab active" id="tabMorning">Morgens</div>
      <div class="tab" id="tabEvening">Abends</div>
    </div>

    <div id="morningSection">
      <div class="card">
        <div class="toggle">
          <span>Training gemacht</span>
          <input type="checkbox" id="am_training" />
        </div>
      </div>

      <div class="card row">
        <div>
          <label>Schlafstunden</label>
          <input type="number" id="am_sleep_hours" step="0.25" min="0" max="24" />
        </div>
        <div>
          <label>Schlafqualität (1–10)</label>
          <input type="number" id="am_sleep_quality_1_10" min="1" max="10" />
        </div>
      </div>

      <div class="card row">
        <div>
          <label>Stimmung (1–10)</label>
          <input type="number" id="am_mood_1_10" min="1" max="10" />
        </div>
        <div>
          <label>Gewicht (kg)</label>
          <input type="number" id="am_weight_kg" step="0.1" min="0" />
        </div>
      </div>

      <div class="card">
        <label>Fokus-Ziel (1 Satz)</label>
        <input type="text" id="am_focus_goal" placeholder="Heute zählt: ..." />
      </div>

      <div class="card row">
        <div class="toggle">
          <span>Winner Mode gemacht</span>
          <input type="checkbox" id="am_winner_mode" />
        </div>
        <div class="toggle">
          <span>Körper-Move gemacht</span>
          <input type="checkbox" id="am_body_move" />
        </div>
      </div>
    </div>

    <div id="eveningSection" style="display:none;">
      <div class="card">
        <div class="toggle">
          <span>Training gemacht</span>
          <input type="checkbox" id="pm_training" />
        </div>
      </div>

      <div class="card row">
        <div>
          <label>Schlafstunden</label>
          <input type="number" id="pm_sleep_hours" step="0.25" min="0" max="24" />
        </div>
        <div>
          <label>Schlafqualität (1–10)</label>
          <input type="number" id="pm_sleep_quality_1_10" min="1" max="10" />
        </div>
      </div>

      <div class="card row">
        <div>
          <label>Stimmung (1–10)</label>
          <input type="number" id="pm_mood_1_10" min="1" max="10" />
        </div>
        <div>
          <label>Gewicht (kg)</label>
          <input type="number" id="pm_weight_kg" step="0.1" min="0" />
        </div>
      </div>

      <div class="card row">
        <div>
          <label>Disziplin (1–10)</label>
          <input type="number" id="pm_discipline_1_10" min="1" max="10" />
        </div>
        <div>
          <label>Aufgaben erledigt</label>
          <input type="number" id="tasks_done" min="0" max="200" />
        </div>
      </div>

      <div class="card row">
        <div>
          <label>Deep Work (Min)</label>
          <input type="number" id="deep_work_minutes" min="0" max="1440" step="15" />
        </div>
        <div>
          <label>Umsatz (EUR)</label>
          <input type="number" id="revenue_eur" min="0" step="10" />
        </div>
      </div>

      <div class="card">
        <label>Notiz (optional)</label>
        <textarea id="notes"></textarea>
      </div>
    </div>

    <div class="card">
      <div class="actions">
        <button class="btn-primary" id="saveMorning">Morgen speichern</button>
        <button class="btn-primary" id="saveEvening">Abend speichern</button>
      </div>
      <div class="tiny" id="status"></div>
    </div>

    <div class="card">
      <div class="actions">
        <button class="btn-success" id="exportCsv">CSV exportieren</button>
        <label class="btn-ghost" style="text-align:center;">
          CSV importieren
          <input type="file" id="importCsv" accept=".csv" style="display:none;" />
        </label>
      </div>
      <button class="btn-danger" id="resetAll" style="margin-top:10px; width:100%;">Alle lokalen Daten löschen</button>
      <div class="tiny">Export passt direkt zur `app.py`-Struktur.</div>
    </div>
  </div>

  <div class="footer">
    <div class="muted">Daten bleiben lokal auf dem Gerät.</div>
  </div>

  <script>
    const STORAGE_KEY = "projectLifeEntries";
    const COLUMNS = [
      "date",
      "am_training",
      "tasks_done",
      "am_focus_goal",
      "am_winner_mode",
      "am_body_move",
      "am_sleep_hours",
      "am_sleep_quality_1_10",
      "am_mood_1_10",
      "am_weight_kg",
      "pm_training",
      "pm_sleep_hours",
      "pm_sleep_quality_1_10",
      "pm_mood_1_10",
      "pm_weight_kg",
      "pm_discipline_1_10",
      "deep_work_minutes",
      "revenue_eur",
      "notes"
    ];

    const el = (id) => document.getElementById(id);

    const state = {
      activeTab: "morning"
    };

    const todayISO = () => new Date().toISOString().slice(0, 10);

    const loadAll = () => {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    };

    const saveAll = (data) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    };

    const getEntry = (date) => {
      const all = loadAll();
      return all[date] || {};
    };

    const setEntry = (date, updates) => {
      const all = loadAll();
      const existing = all[date] || { date };
      all[date] = { ...existing, ...updates };
      saveAll(all);
    };

    const fillForm = (date) => {
      const entry = getEntry(date);
      const setValue = (id, value) => {
        const input = el(id);
        if (!input) return;
        if (input.type === "checkbox") {
          input.checked = Boolean(Number(value || 0));
        } else {
          input.value = value ?? "";
        }
      };

      COLUMNS.forEach((col) => {
        if (col !== "date") setValue(col, entry[col]);
      });
    };

    const collectMorning = () => ({
      am_training: el("am_training").checked ? 1 : 0,
      am_sleep_hours: el("am_sleep_hours").value || "",
      am_sleep_quality_1_10: el("am_sleep_quality_1_10").value || "",
      am_mood_1_10: el("am_mood_1_10").value || "",
      am_weight_kg: el("am_weight_kg").value || "",
      am_focus_goal: el("am_focus_goal").value || "",
      am_winner_mode: el("am_winner_mode").checked ? 1 : 0,
      am_body_move: el("am_body_move").checked ? 1 : 0
    });

    const collectEvening = () => ({
      pm_training: el("pm_training").checked ? 1 : 0,
      pm_sleep_hours: el("pm_sleep_hours").value || "",
      pm_sleep_quality_1_10: el("pm_sleep_quality_1_10").value || "",
      pm_mood_1_10: el("pm_mood_1_10").value || "",
      pm_weight_kg: el("pm_weight_kg").value || "",
      pm_discipline_1_10: el("pm_discipline_1_10").value || "",
      tasks_done: el("tasks_done").value || "",
      deep_work_minutes: el("deep_work_minutes").value || "",
      revenue_eur: el("revenue_eur").value || "",
      notes: el("notes").value || ""
    });

    const showStatus = (msg) => {
      el("status").textContent = msg;
      setTimeout(() => (el("status").textContent = ""), 2000);
    };

    const setTab = (tab) => {
      state.activeTab = tab;
      el("tabMorning").classList.toggle("active", tab === "morning");
      el("tabEvening").classList.toggle("active", tab === "evening");
      el("morningSection").style.display = tab === "morning" ? "block" : "none";
      el("eveningSection").style.display = tab === "evening" ? "block" : "none";
    };

    el("tabMorning").addEventListener("click", () => setTab("morning"));
    el("tabEvening").addEventListener("click", () => setTab("evening"));

    el("saveMorning").addEventListener("click", () => {
      const date = el("entryDate").value;
      if (!date) return showStatus("Bitte Datum wählen.");
      setEntry(date, collectMorning());
      showStatus("Morgen gespeichert.");
    });

    el("saveEvening").addEventListener("click", () => {
      const date = el("entryDate").value;
      if (!date) return showStatus("Bitte Datum wählen.");
      setEntry(date, collectEvening());
      showStatus("Abend gespeichert.");
    });

    el("entryDate").addEventListener("change", (e) => fillForm(e.target.value));

    const toCsv = (rows) => {
      const header = COLUMNS.join(",");
      const escape = (val) => {
        const text = String(val ?? "");
        if (text.includes(",") || text.includes("\n") || text.includes('"')) {
          return '"' + text.replace(/"/g, '""') + '"';
        }
        return text;
      };
      const lines = rows.map((row) => COLUMNS.map((c) => escape(row[c])).join(","));
      return [header, ...lines].join("\n");
    };

    const fromCsv = (text) => {
      const rows = [];
      const lines = text.split(/\r?\n/).filter(Boolean);
      if (!lines.length) return rows;
      const header = lines.shift().split(",");

      const parseLine = (line) => {
        const result = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i++;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (char === "," && !inQuotes) {
            result.push(current);
            current = "";
          } else {
            current += char;
          }
        }
        result.push(current);
        return result;
      };

      lines.forEach((line) => {
        const values = parseLine(line);
        const row = {};
        header.forEach((col, idx) => {
          row[col] = values[idx] ?? "";
        });
        rows.push(row);
      });
      return rows;
    };

    el("exportCsv").addEventListener("click", () => {
      const all = loadAll();
      const rows = Object.keys(all)
        .sort()
        .map((date) => ({ date, ...all[date] }));
      const csv = toCsv(rows);
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `project_life_mobile_${todayISO()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    el("importCsv").addEventListener("change", (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const rows = fromCsv(reader.result);
        const all = loadAll();
        rows.forEach((row) => {
          if (!row.date) return;
          all[row.date] = { ...(all[row.date] || {}), ...row };
        });
        saveAll(all);
        fillForm(el("entryDate").value);
        showStatus("CSV importiert.");
      };
      reader.readAsText(file);
    });

    el("resetAll").addEventListener("click", () => {
      if (confirm("Alle lokalen Daten löschen?")) {
        localStorage.removeItem(STORAGE_KEY);
        fillForm(el("entryDate").value);
        showStatus("Lokale Daten gelöscht.");
      }
    });

    const init = () => {
      el("entryDate").value = todayISO();
      fillForm(todayISO());
    };

    init();
  </script>
</body>
</html>
