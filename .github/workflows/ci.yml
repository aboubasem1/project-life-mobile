name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lifeos_test
          POSTGRES_PASSWORD: lifeos_test
          POSTGRES_DB: lifeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lifeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://lifeos_test:lifeos_test@localhost:5432/lifeos_test
    defaults:
      run:
        working-directory: projectdashboardv1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            projectdashboardv1/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npx tsc -b --pretty false
      - run: npx tsc -p tsconfig.server.json --pretty false
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - name: Build production container images
        working-directory: .
        run: |
          docker build --target api --tag lifeos-api:ci .
          docker build --target web --tag lifeos-web:ci .
          docker build --target backup --tag lifeos-backup:ci .
