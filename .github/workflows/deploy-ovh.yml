name: Deploy OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeos-ovh-production
  cancel-in-progress: false

jobs:
  verify:
    if: vars.OVH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            projectdashboardv1/package-lock.json
      - name: Install server dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm --prefix projectdashboardv1 ci
      - name: Verify application
        run: |
          npm --prefix projectdashboardv1 run typecheck
          npm --prefix projectdashboardv1 test
          npm --prefix projectdashboardv1 run build
          npm --prefix projectdashboardv1 run build:server
      - name: Verify container images
        run: |
          docker build --target api --tag lifeos-api:verify .
          docker build --target web --tag lifeos-web:verify .
          docker build --target backup --tag lifeos-backup:verify .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_USER: ${{ vars.OVH_USER }}
      OVH_SSH_PORT: ${{ vars.OVH_SSH_PORT || '22' }}
      OVH_DEPLOY_PATH: ${{ vars.OVH_DEPLOY_PATH || '/opt/lifeos' }}
      OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OVH_HOST" && "$OVH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ -n "$OVH_USER" && "$OVH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$OVH_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$OVH_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$OVH_DEPLOY_PATH" != *"//"* && "$OVH_DEPLOY_PATH" != *"/../"* && "$OVH_DEPLOY_PATH" != */.. ]]
          [[ "$OVH_DEPLOY_PATH" != *"/./"* && "$OVH_DEPLOY_PATH" != */. && "$OVH_DEPLOY_PATH" != "/" ]]
          [[ -n "$OVH_SSH_PRIVATE_KEY" ]]
          [[ -n "$OVH_KNOWN_HOSTS" ]]
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/lifeos-ssh"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lifeos-ssh/key"
          printf '%s\n' "$OVH_KNOWN_HOSTS" > "$RUNNER_TEMP/lifeos-ssh/known_hosts"
      - name: Create release archive
        shell: bash
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/lifeos-$GITHUB_SHA.tar.gz" "$GITHUB_SHA"
      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/lifeos-ssh/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lifeos-ssh/known_hosts" \
            -p "$OVH_SSH_PORT" \
            "$OVH_USER@$OVH_HOST" \
            "install -d -m 0750 '$OVH_DEPLOY_PATH/incoming' && umask 077 && cat > '$OVH_DEPLOY_PATH/incoming/$GITHUB_SHA.tar.gz'" \
            < "$RUNNER_TEMP/lifeos-$GITHUB_SHA.tar.gz"
      - name: Deploy revision
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/lifeos-ssh/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lifeos-ssh/known_hosts" \
            -p "$OVH_SSH_PORT" \
            "$OVH_USER@$OVH_HOST" \
            "LIFEOS_DEPLOY_ROOT='$OVH_DEPLOY_PATH' sh -s -- '$GITHUB_SHA'" \
            < infrastructure/scripts/remote-deploy.sh
