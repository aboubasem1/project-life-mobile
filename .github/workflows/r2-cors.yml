name: R2 CORS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install AWS SDK
        run: npm install --no-save @aws-sdk/client-s3@^3.1137.0
      - name: Apply R2 CORS for LifeOS origin
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'lifeos-production' }}
          R2_REGION: ${{ vars.R2_REGION || 'auto' }}
          LIFEOS_SITE_ORIGIN: https://vps-01d88277.vps.ovh.net
        run: node infrastructure/scripts/apply-r2-cors.mjs
