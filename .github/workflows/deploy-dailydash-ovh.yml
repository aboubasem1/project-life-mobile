name: Deploy DailyDash OVH

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dailydash-ovh-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_USER: ${{ vars.OVH_USER }}
      OVH_SSH_PORT: ${{ vars.OVH_SSH_PORT || '22' }}
      OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
      DAILYDASH_TYPESAFE_API_KEY: ${{ secrets.DAILYDASH_TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$OVH_HOST" && "$OVH_HOST" =~ ^[A-Za-z0-9._:-]+$ ]]
          [[ -n "$OVH_USER" && "$OVH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$OVH_SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ -n "$OVH_SSH_PRIVATE_KEY" ]]
          [[ -n "$OVH_KNOWN_HOSTS" ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/dailydash-ssh"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/dailydash-ssh/key"
          printf '%s\n' "$OVH_KNOWN_HOSTS" > "$RUNNER_TEMP/dailydash-ssh/known_hosts"

      - name: Load DailyDash images
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull ghcr.io/aboubasem1/dailydash-backend:latest
          docker pull ghcr.io/aboubasem1/dailydash-frontend:latest
          docker pull ghcr.io/aboubasem1/dailydash-docs:latest
          docker save \
            ghcr.io/aboubasem1/dailydash-backend:latest \
            ghcr.io/aboubasem1/dailydash-frontend:latest \
            ghcr.io/aboubasem1/dailydash-docs:latest \
            | gzip \
            | ssh \
                -i "$RUNNER_TEMP/dailydash-ssh/key" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$RUNNER_TEMP/dailydash-ssh/known_hosts" \
                -p "$OVH_SSH_PORT" \
                "$OVH_USER@$OVH_HOST" \
                "gunzip | docker load"

      - name: Upload deployment definition
        shell: bash
        run: |
          set -euo pipefail
          tar -C infrastructure/dailydash -czf - . \
            | ssh \
                -i "$RUNNER_TEMP/dailydash-ssh/key" \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$RUNNER_TEMP/dailydash-ssh/known_hosts" \
                -p "$OVH_SSH_PORT" \
                "$OVH_USER@$OVH_HOST" \
                "install -d -m 0750 /opt/dailydash && tar -xzf - -C /opt/dailydash"

      - name: Configure and start DailyDash
        shell: bash
        run: |
          set -euo pipefail
          jev_key_b64="$(printf '%s' "$DAILYDASH_TYPESAFE_API_KEY" | base64 -w 0)"
          ssh \
            -i "$RUNNER_TEMP/dailydash-ssh/key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/dailydash-ssh/known_hosts" \
            -p "$OVH_SSH_PORT" \
            "$OVH_USER@$OVH_HOST" \
            "DAILYDASH_JEV_KEY_B64='$jev_key_b64' sh -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/dailydash
          umask 077
          if [ ! -f .env ]; then
            db_password="$(openssl rand -hex 32)"
            app_secret="$(openssl rand -hex 48)"
            printf '%s\n' \
              "APP_ENV=production" \
              "SECRET_KEY=$app_secret" \
              "POSTGRES_USER=dailydash" \
              "POSTGRES_PASSWORD=$db_password" \
              "POSTGRES_DB=dailydash" \
              "AUTH_DISABLED=true" \
              "JEV_ENABLED=false" \
              "JEV_MODE=shadow" \
              "JEV_PRODUCTION_DATA_ENABLED=false" \
              "JEV_API_URL=https://api.typesafe.ai/v1/systemone" \
              "JEV_MODEL=jev-latest" \
              "JEV_TIMEOUT_MS=2500" > .env
            chmod 600 .env
          fi
          if [ -n "${DAILYDASH_JEV_KEY_B64:-}" ]; then
            jev_key="$(printf '%s' "$DAILYDASH_JEV_KEY_B64" | base64 -d)"
            sed -i '/^TYPESAFE_API_KEY=/d;/^JEV_ENABLED=/d' .env
            printf 'TYPESAFE_API_KEY=%s\nJEV_ENABLED=true\n' "$jev_key" >> .env
          fi
          docker compose --project-name dailydash --env-file .env pull postgres redis caddy
          docker compose --project-name dailydash --env-file .env up -d --remove-orphans
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              docker compose --project-name dailydash ps
              printf '%s\n' DAILYDASH_DEPLOY_OK
              exit 0
            fi
            sleep 4
          done
          docker compose --project-name dailydash ps
          docker compose --project-name dailydash logs --tail=120 backend caddy
          exit 1
          REMOTE

      - name: Public smoke test
        shell: bash
        run: curl --fail --show-error --silent --retry 10 --retry-delay 3 "http://$OVH_HOST:8080/health"
