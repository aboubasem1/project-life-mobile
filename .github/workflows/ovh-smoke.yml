name: OVH Bootstrap Smoke Test

on:
  push:
    branches:
      - migration/ovh-r2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OVH_HOST: ${{ vars.OVH_HOST }}
      OVH_USER: ${{ vars.OVH_USER }}
      OVH_SSH_PORT: ${{ vars.OVH_SSH_PORT || '22' }}
      OVH_DEPLOY_PATH: ${{ vars.OVH_DEPLOY_PATH || '/opt/lifeos' }}
      OVH_SSH_PRIVATE_KEY: ${{ secrets.OVH_SSH_PRIVATE_KEY }}
      OVH_KNOWN_HOSTS: ${{ secrets.OVH_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/lifeos-ssh"
          printf '%s\n' "$OVH_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/lifeos-ssh/key"
          printf '%s\n' "$OVH_KNOWN_HOSTS" > "$RUNNER_TEMP/lifeos-ssh/known_hosts"
      - name: Verify OVH bootstrap
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/lifeos-ssh/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/lifeos-ssh/known_hosts" \
            -p "$OVH_SSH_PORT" \
            "$OVH_USER@$OVH_HOST" \
            "set -eu; docker --version; docker compose version; docker info >/dev/null; test -w '$OVH_DEPLOY_PATH'; test -f '$OVH_DEPLOY_PATH/shared/.env'; test \"\$(stat -c %a '$OVH_DEPLOY_PATH/shared/.env')\" = 600; printf '%s\\n' OVH_SMOKE_OK"
