services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailydash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dailydash}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    image: ghcr.io/aboubasem1/dailydash-backend:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://dailydash:${POSTGRES_PASSWORD}@postgres:5432/dailydash
      DATABASE_URL_SYNC: postgresql://dailydash:${POSTGRES_PASSWORD}@postgres:5432/dailydash
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_DISABLED: "true"
      JEV_PRODUCTION_DATA_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [internal]

  celery-worker:
    image: ghcr.io/aboubasem1/dailydash-backend:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://dailydash:${POSTGRES_PASSWORD}@postgres:5432/dailydash
      DATABASE_URL_SYNC: postgresql://dailydash:${POSTGRES_PASSWORD}@postgres:5432/dailydash
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  celery-beat:
    image: ghcr.io/aboubasem1/dailydash-backend:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://dailydash:${POSTGRES_PASSWORD}@postgres:5432/dailydash
      DATABASE_URL_SYNC: postgresql://dailydash:${POSTGRES_PASSWORD}@postgres:5432/dailydash
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AUTH_DISABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  frontend:
    image: ghcr.io/aboubasem1/dailydash-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  docs:
    image: ghcr.io/aboubasem1/dailydash-docs:latest
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      docs:
        condition: service_started
    networks: [internal]

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge
